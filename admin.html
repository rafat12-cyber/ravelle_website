<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravelle admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/admin/admin.css">
</head>
<body>

<!-- Sign in -->
<main class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <img src="assets/img/logo.png" alt="Ravelle" width="90" height="48">
    <h1 class="h1">Admin panel</h1>
    <p class="muted" id="loginNote">Sign in to manage your store.</p>
    <label class="field"><span>Email</span><input class="input" name="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn btn--dark" type="submit">Sign in</button>
    <a class="muted small" href="./">← Back to the store</a>
  </form>
</main>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side__brand" href="#/dashboard"><img src="assets/img/logo.png" alt="" width="44" height="24"><span>Ravelle</span></a>
    <nav class="side__nav" id="sideNav" aria-label="Admin"></nav>
    <div class="side__foot">
      <a class="side__store" href="./" target="_blank" rel="noopener">View store ↗</a>
      <a class="side__user" href="#/account" id="sideUser"></a>
      <button class="btn btn--ghost btn--sm" type="button" id="logout">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon top__menu" type="button" id="menuBtn" aria-label="Menu">☰</button>
      <p class="top__title" id="topTitle"></p>
      <span class="badge badge--demo" id="demoBadge" hidden>Demo data in this browser · <button type="button" id="resetDemo">Reset</button></span>
    </header>
    <section class="view" id="view" tabindex="-1"></section>
  </div>
</div>
<div class="side-scrim" id="sideScrim" hidden></div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head"><h2 class="h2" id="modalTitle"></h2><button class="icon" type="button" data-modal-close aria-label="Close">✕</button></header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/client.js"></script>
<script src="assets/admin/admin.js"></script>
</body>
</html>
